# Amu Darya negotiation environment.
#
# Every number tagged ILLUSTRATIVE is a placeholder chosen so the game has a real
# tension. Calibrate these against the corpus (and cite the source next to the
# value) before reporting any result. Values tagged SOURCED come from the seed
# corpus documents named in the comment.

basin: Amu Darya
unit: km3                     # volumes are km3 (= bcm) per year
value_unit: USD million equivalent

seasons: [growing, winter]    # growing = April to September, winter = October to March

# Allocable flow per season before any upstream storage shift.
# 61.5 km3 total = Protocol 566 limit (SOURCED: protocol_566_allocation.md).
# 70/30 seasonal split and the dry/wet multipliers are ILLUSTRATIVE.
flow_scenarios:
  normal: {growing: 43.0, winter: 18.5}
  dry:    {growing: 34.4, winter: 14.8}
  wet:    {growing: 49.5, winter: 21.3}

# Minimum flow that must reach the Aral delta, per season. ILLUSTRATIVE.
environmental_flow: {growing: 4.0, winter: 2.0}

# Tajikistan can hold growing season water in Nurek/Rogun and release it in winter
# for electricity. Max volume shiftable per year. ILLUSTRATIVE.
max_storage_shift: 6.0
storage_country: Tajikistan

# Historical reference shares (SOURCED: protocol_566_allocation.md).
# Used only as the status quo anchor and for the "anchoring to precedent" metric.
protocol_566_km3:
  Uzbekistan: 29.6
  Turkmenistan: 22.0
  Tajikistan: 9.5
  Kyrgyzstan: 0.4      # SOURCED: protocol_566_allocation.md -- 0.6% of the 61.5 km3 total, the smallest share of any party

countries:
  # Kyrgyzstan replaces Afghanistan as the fourth delegation (2026-11-10). It is not
  # literally an Amu Darya riparian (its main territory and irrigation sit in the
  # Syr Darya basin), but it holds headwater tributaries feeding the Amu Darya via
  # the Pamir-Alai range and was a Protocol 566 party (SOURCED, see share above),
  # so it keeps the "upstream, smallest historical share" structural role
  # Afghanistan played. See corpus/kyrgyzstan_upstream.md and data/Kyrgystan.txt.
  Kyrgyzstan:
    position: upstream (Pamir-Alai headwater tributaries), smallest Protocol 566 share, aging hydro infrastructure
    irrigation_growing: 90      # A in A*ln(1+w). ILLUSTRATIVE, scaled down from Afghanistan's 420: Kyrgyzstan's real
                                 # Amu-Darya-side irrigation footprint is far smaller (0.4 km3 historical share vs 2.1 km3)
    irrigation_winter: 15
    hydropower_per_km3_shift: 0
    delta_penalty_per_km3: 0
    unilateral_take: {growing: 0.5, winter: 0.2}   # new upstream reservoirs/micro-hydro without a deal. ILLUSTRATIVE,
                                                    # anchored above the 0.4 km3 Protocol 566 share (SOURCED) rather than
                                                    # Qosh Tepa's 10 km3/yr ceiling, since Kyrgyzstan's dossier describes
                                                    # small-scale reservoirs/micro-hydro, not a farmland diversion canal
  Tajikistan:
    position: upstream, Vakhsh and Panj, Nurek and Rogun storage
    irrigation_growing: 260
    irrigation_winter: 30
    hydropower_per_km3_shift: 120  # winter electricity value of each km3 shifted. ILLUSTRATIVE
    delta_penalty_per_km3: 0
    unilateral_take: {growing: 6.6, winter: 2.9}   # Protocol 566 share split 70/30
  Uzbekistan:
    position: midstream and downstream, Khorezm and Karakalpakstan at the delta
    irrigation_growing: 900
    irrigation_winter: 90
    hydropower_per_km3_shift: 0
    delta_penalty_per_km3: 140     # cost per km3 of shortfall below environmental flow. ILLUSTRATIVE
  Turkmenistan:
    position: midstream, Karakum Canal
    irrigation_growing: 720
    irrigation_winter: 70
    hydropower_per_km3_shift: 0
    delta_penalty_per_km3: 50

# What happens with no agreement (each delegate's walk away point):
# Kyrgyzstan and Tajikistan take their unilateral volumes, Tajikistan shifts the
# full storage volume to winter, Uzbekistan and Turkmenistan split what is left by
# their Protocol 566 ratio, nothing is reserved for the delta, and every country
# pays a diplomatic conflict cost.
no_deal:
  storage_shift: 6.0
  conflict_cost: 40            # ILLUSTRATIVE, paid by every country

transfer_bounds: 400           # max absolute net side payment per country
