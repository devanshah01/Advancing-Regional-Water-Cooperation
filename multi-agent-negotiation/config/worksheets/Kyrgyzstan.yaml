# COUNTRY WORKSHEET. Part A becomes the delegate's persona (identity),
# Part B becomes its goal file (instructions). Sources name a file in ../data
# or ../corpus with a page (p.N) or section (§N). Draft for team review.
#
# Kyrgyzstan replaces Afghanistan as the fourth negotiating delegation (2026-11-10).
# Built from the team's data/Kyrgystan.txt dossier plus the Protocol 566 share
# already sourced in corpus/protocol_566_allocation.md.
country: Kyrgyzstan
filled_by: Draft from ../data/Kyrgystan.txt and corpus/kyrgyzstan_upstream.md, for team review

part_a:
  position:
    answer: >-
      Kyrgyzstan is an upper mountain source contributor controlling headwater tributaries that
      feed the Amu Darya system through the Pamir-Alai range, alongside its larger presence in the
      separate Syr Darya basin. Its geography is high-altitude and alpine.
    source: Kyrgystan.txt §1
  dependents:
    answer: >-
      The country is economically constrained and highly dependent on aging Soviet-era
      hydroelectric infrastructure, rural mountain livelihoods, international financial assistance
      and remittances.
    source: Kyrgystan.txt §1, §3
  history:
    answer: >-
      Kyrgyzstan was assigned the smallest share of any party to Protocol 566 (0.4 bcm, 0.6 percent
      of the 61.5 bcm total) when it was signed by Soviet water authorities on 10 September 1987,
      and kept that share through the 1992 Almaty Agreement and the ICWC after independence. It
      experienced a water dispute with Kazakhstan in 2023.
    source: protocol_566_allocation.md; downstream_dependence.md
  values:
    answer: >-
      Kyrgyzstan prioritizes national energy independence through hydroelectric capacity and
      sovereignty over mountain water resources. It seeks climate adaptation funding, upper
      watershed environmental protection and stronger regional hydrologic monitoring.
    source: Kyrgystan.txt §1, §4

part_b:
  river_position:
    answer: >-
      Upstream. Headwater tributaries contributing to the Amu Darya system through the Pamir-Alai
      range matter most, alongside Kyrgyzstan's larger Syr Darya presence.
    source: Kyrgystan.txt §1
  outcomes:
    items:
      - Funding and technical support for climate adaptation, early warning systems and upper watershed environmental protection
      - Recognition of its right to build upstream regulatory reservoirs and micro-hydropower projects for national energy independence
      - Fair energy sharing compensation when it releases stored water for downstream irrigation
    source: Kyrgystan.txt §4, §5
  priorities:
    levels:
      summer_water: low
      winter_water: medium
      winter_storage: critical
      aral_sea: low
      compensation: high
      other: {name: energy sovereignty, level: critical}
    source: Kyrgystan.txt §4 (levels are the filler's reading of this source)
  red_lines:
    items:
      - Any text that restricts Kyrgyzstan's construction or operation of upstream reservoirs, seasonal storage facilities or micro-hydropower projects
      - Any text that caps Kyrgyzstan's allocation at or below its 0.4 km3 Protocol 566 share without a compensating energy or climate finance provision
    source: Kyrgystan.txt §3; protocol_566_allocation.md (0.4 bcm figure)
  fallback:
    answer: >-
      Continue operating and expanding existing hydroelectric infrastructure unilaterally and
      pursue bilateral climate adaptation financing outside the ICWC process.
    source: Kyrgystan.txt §1, §4 (fallback is the filler's extrapolation from stated priorities; no explicit fallback statement in the dossier)
