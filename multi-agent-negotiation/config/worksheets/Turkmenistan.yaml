# COUNTRY WORKSHEET. Part A becomes the delegate's persona (identity),
# Part B becomes its goal file (instructions). Sources name a file in ../data
# with a page (p.N) or section (§N). Draft for team review.
country: Turkmenistan
filled_by: Draft from ../data, for team review

part_a:
  position:
    answer: >-
      Turkmenistan is a midstream and lower basin state. The Karakum Canal, over 1,300 km long,
      diverts more than 30 percent of the Amu Darya's natural flow into desert farmland.
    source: info.txt §1; infrastructure.txt §3
  dependents:
    answer: >-
      Over 45 percent of the workforce is tied to agriculture, mainly state-mandated cotton and
      wheat. Turkmenabat's textile and chemical plants also rely on the river.
    source: info.txt §1, §2
  history:
    answer: >-
      The Karakum Canal runs through sandy soils that lose large volumes to seepage. Turkmenistan
      hosted the 95th ICWC meeting at Avaza in October 2026 and runs a joint water commission with
      Uzbekistan.
    source: infrastructure.txt §2; Limits.pdf p.1; foundational agreements.pdf p.4
  values:
    answer: >-
      Turkmenistan follows a policy of neutrality and prefers bilateral water diplomacy over
      multilateral confrontation. It values sovereignty over its internal agricultural quotas.
    source: government.txt §2

part_b:
  river_position:
    answer: >-
      Downstream. The Karakum Canal intake, the Kerki gauging station and the Ozyorny and Daryolik
      collectors matter most.
    source: info.txt §1; Limits.pdf p.4; foundational agreements.pdf p.4
  outcomes:
    items:
      - A stable growing season supply for the Karakum Canal at or above the 2026 ICWC limit of 15.5 billion cubic metres for April to October
      - Financing for geomembrane lining of the Karakum Canal trunk lines
      - An agreed flow measurement method that resolves the discrepancies at Kerki
    source: Limits.pdf p.4, p.5; government.txt §2
  priorities:
    levels:
      summer_water: critical
      winter_water: low
      winter_storage: low
      aral_sea: medium
      compensation: medium
      other: {name: predictability of the allocation rule, level: high}
    source: government.txt §2 (levels are the filler's reading; aral_sea level NO SOURCE YET)
  red_lines:
    items:
      - Any clause that gives an external body authority to set volumetric cuts to Turkmenistan's internal agricultural quotas
      - A growing season allocation below 15.5 billion cubic metres
    source: government.txt §2 (quotas); Limits.pdf p.5 (figure only, red line status NO SOURCE YET)
  fallback:
    answer: >-
      Rely on existing intakes, the ICWC limit and bilateral arrangements with Uzbekistan.
    source: government.txt §2; foundational agreements.pdf p.4
