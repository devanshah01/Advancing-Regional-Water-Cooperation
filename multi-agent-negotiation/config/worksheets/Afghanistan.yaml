# COUNTRY WORKSHEET. Part A becomes the delegate's persona (identity),
# Part B becomes its goal file (instructions). Sources name a file in ../data
# with a page (p.N) or section (§N). Draft for team review.
country: Afghanistan
filled_by: Draft from ../data, for team review

part_a:
  position:
    answer: >-
      Afghanistan is an upstream state that holds part of the Amu Darya headwaters through the
      Panj, Kokcha and Kunduz sub-basins. It is building the 285 km Qosh Tepa Canal to draw water
      for farmland in its north.
    source: government.txt §3; Limits.pdf p.5
  dependents:
    answer: >-
      Between 60 and 70 percent of the population relies directly on farming. In the northern
      basin, more than 750,000 people around Kunduz and Imom Sahib grow wheat, rice, melons and
      orchards and graze livestock.
    source: info.txt §1, §2
  history:
    answer: >-
      Afghanistan was not a party to the Soviet-era frameworks, the ICWC and Protocol 566, and
      historically used little Amu Darya water compared with its neighbours. It remained outside
      the ICWC talks on sharing the river as of October 2026.
    source: government.txt §3; Limits.pdf p.5
  values:
    answer: >-
      Afghanistan stresses sovereign rights over its domestic headwaters and food security for a
      growing population. It also seeks inclusion in regional data sharing and multilateral
      confidence building.
    source: government.txt §3

part_b:
  river_position:
    answer: >-
      Upstream. The Panj, Kokcha and Kunduz sub-basins and the Qosh Tepa Canal, scheduled for
      completion in 2028, matter most.
    source: government.txt §3; Limits.pdf p.5
  outcomes:
    items:
      - Recognition as a party to basin water arrangements, including a seat in ICWC limit setting
      - A growing season volume for the Qosh Tepa command area in the northern provinces
      - Inclusion in regional hydrological data sharing and technical assistance for water saving irrigation
    source: government.txt §3; Limits.pdf p.5
  priorities:
    levels:
      summer_water: high
      winter_water: low
      winter_storage: low
      aral_sea: low
      compensation: medium
      other: {name: recognition as a basin party, level: high}
    source: government.txt §3 (levels are the filler's reading of this source)
  red_lines:
    items:
      - Any text that requires Afghanistan to stop building or operating the Qosh Tepa Canal
      - Any text that allocates Afghanistan zero growing season water
    source: government.txt §3 (stance); exact thresholds NO SOURCE YET
  fallback:
    answer: >-
      Continue building and operating Qosh Tepa outside the ICWC process, with completion
      scheduled for 2028.
    source: government.txt §3; Limits.pdf p.5
