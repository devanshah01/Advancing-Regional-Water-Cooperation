# Goal files: each country's instructions from its government, kept as data.
#
# SUPERSEDED: config/worksheets/<Country>.yaml (Part B) now supplies the goals for every
# country that has a worksheet. This file is the fallback for a country without one.
#
# Persona (config/personas.yaml) = who the agent is.     An experimental factor.
# Goals   (this file)             = what it is told to get. Changes through events.
#
# Every statement here should be traceable to the corpus. Placeholders are marked
# DRAFT; the team should review them like a payoff table.
#
# Fields: bloc, objectives (list), priorities (map), red_lines (list), fallback (text)

Kyrgyzstan:
  bloc: upstream (Pamir-Alai headwater tributaries)
  objectives:
    - Secure recognition of its right to build upstream reservoirs and micro-hydropower projects
    - Obtain climate adaptation funding and energy sharing compensation
  priorities: {winter_storage: high, growing_water: low, side_payments: medium, energy_sovereignty: high}
  red_lines:
    - No text that caps Kyrgyzstan at or below its 0.4 km3 Protocol 566 share without compensation   # DRAFT
  fallback: Continue operating and expanding hydroelectric infrastructure unilaterally.

Tajikistan:
  bloc: upstream (Vakhsh and Panj, Nurek and Rogun storage)
  objectives:
    - Keep the right to store growing season water for winter electricity
    - Obtain compensation for any summer releases made for downstream irrigation
  priorities: {winter_storage: high, growing_water: medium, side_payments: high}
  red_lines:
    - No text that sets the storage shift to zero without compensation   # DRAFT
  fallback: Operate reservoirs for winter power and keep the Protocol 566 share.

Uzbekistan:
  bloc: downstream (midstream intakes, Khorezm and Karakalpakstan at the delta)
  objectives:
    - Secure reliable growing season water for irrigated agriculture
    - Keep a minimum flow reaching the Aral delta
    - Limit new upstream withdrawals, especially Qosh Tepa
  priorities: {growing_water: high, delta_flow: high, winter_water: low, side_payments: medium}
  red_lines:
    - No text that leaves the Aral delta below its minimum flow   # DRAFT
  fallback: Rely on existing intakes and the Protocol 566 ratio.

Turkmenistan:
  bloc: downstream (Karakum Canal intake)
  objectives:
    - Secure growing season water for the Karakum Canal
    - Keep a stable, predictable allocation rule
  priorities: {growing_water: high, predictability: high, winter_water: low, side_payments: medium}
  red_lines:
    - No text that cuts Turkmenistan's growing season share below its Protocol 566 ratio without compensation   # DRAFT
  fallback: Rely on existing intakes and the Protocol 566 ratio.
