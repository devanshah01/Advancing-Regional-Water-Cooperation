# Factorial experiment. Every combination of factors x scenario x model x seed is one run.
# The retriever (BM25 or the team's Chroma pipeline) is set in config/rag.yaml.
name: pilot_mock

# Models:
#   - {name: qwen32b, type: ollama, model: "qwen2.5:32b"}              # same Ollama server as the RAG app
#   - {name: llama8b, type: ollama, model: "llama3.1:8b"}
#   - {name: claude, type: anthropic, model: claude-sonnet-5-5}
#   - {name: qwen32b-vllm, type: openai_compat, base_url: http://localhost:8000/v1, model: Qwen/Qwen2.5-32B-Instruct}
models:
  - {name: mock, type: mock}

factors:
  persona: [none, rich, worksheet]            # add rich_v2, rich_v3 for prompt sensitivity runs
  payoff: [hidden, own, full]      # hidden = narrative only, own = own payoffs, full = everyone's payoffs
  grounding: [rag, none]           # rag = document passages and lookups, none = no documents
  legal: ["on"]                    # add "off" (quoted: YAML reads bare on/off as true/false) to test the legal advisor's influence
  events: [none]                   # keys in config/events.yaml, e.g. qosh_tepa_shock, energy_crisis

scenarios: [normal, dry]
seeds: 3
max_rounds: 6
temperature: 0.7
